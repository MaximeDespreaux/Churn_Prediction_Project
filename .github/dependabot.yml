version: 2
updates:
  # Python dependencies (pyproject.toml + uv.lock)
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      uv-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # Actions used in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # Base images in the Dockerfile
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      docker-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
