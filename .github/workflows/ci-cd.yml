name: CI/CD

# lint --+
#        +--> build (app, pipeline and test images; --> publish (app + pipeline images to --> release
# test --+     app + CLI smoke tests, pytest in the      GHCR [+ Docker Hub])               v* tags only
#              test image)                               push to main / v* tags

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # `uv sync` / `uv run` (called by make) fail instead of rewriting an outdated uv.lock
  UV_LOCKED: "1"
  # Images are named <prefix>-<Dockerfile target>: churn-prediction-app, -pipeline, -test
  IMAGE_PREFIX: churn-prediction

jobs:
  lint:
    name: Lint & checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # setup-uv only publishes full version tags from v8 on (no floating `v10`)
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.15"
          enable-cache: true
          python-version: "3.12"
      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      # all pre-commit hooks (ruff, black, uv.lock sync, file hygiene) on every file
      - run: make check

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.15"
          enable-cache: true
          # Exported as UV_PYTHON for every later step, so both `uv sync` and
          # `uv run` (called by make) use this interpreter instead of uv's default one.
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: make install
      - name: Run tests
        run: make test
      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  build:
    name: Docker build & smoke tests
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # One Dockerfile, three targets; each target has its own cache scope
      # (shared with the publish job) so they don't overwrite each other.
      - name: Build app image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          load: true
          tags: ${{ env.IMAGE_PREFIX }}-app:ci
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      - name: Build pipeline image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: pipeline
          load: true
          tags: ${{ env.IMAGE_PREFIX }}-pipeline:ci
          cache-from: type=gha,scope=pipeline
          cache-to: type=gha,mode=max,scope=pipeline
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          load: true
          tags: ${{ env.IMAGE_PREFIX }}-test:ci
          cache-from: type=gha,scope=test
          cache-to: type=gha,mode=max,scope=test
      - name: Run app container
        run: make docker-run IMAGE="${IMAGE_PREFIX}-app" TAG=ci
      - name: Check app health
        run: make docker-smoke
      - name: Check the app page is served
        run: |
          page="$(curl --silent --show-error --fail http://localhost:8501/)"
          grep --quiet --ignore-case "streamlit" <<< "$page"
          echo "Streamlit page served"
      # `<command> --help` also imports each command's module (and its ML libraries)
      - name: Check the pipeline CLI
        run: |
          docker run --rm "${IMAGE_PREFIX}-pipeline:ci" --help
          for command in build-features evaluate train predict tune; do
            docker run --rm "${IMAGE_PREFIX}-pipeline:ci" "$command" --help > /dev/null
            echo "churn $command --help: OK"
          done
      - name: Run the test suite in the test image
        run: docker run --rm "${IMAGE_PREFIX}-test:ci"
      - name: Stop app container
        if: always()
        run: make docker-stop

  publish:
    name: Publish ${{ matrix.image }} image
    runs-on: ubuntu-latest
    needs: build
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [app, pipeline]
    outputs:
      # identical for both images (derived from the Git ref)
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      # GHCR image names must be lowercase. Docker Hub is added only when the
      # DOCKERHUB_USERNAME variable (and the DOCKERHUB_TOKEN secret) are set.
      - name: Image names
        id: images
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          IMAGE_NAME: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "name=${IMAGE_NAME}"
            echo "list<<EOF"
            echo "ghcr.io/${owner}/${IMAGE_NAME}"
            if [ -n "$DOCKERHUB_USERNAME" ]; then
              echo "${DOCKERHUB_USERNAME}/${IMAGE_NAME}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        if: vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.list }}
          # `latest` follows the default branch only, not release tags
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          # keep the per-image title instead of the repository name
          labels: org.opencontainers.image.title=${{ steps.images.outputs.name }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.image }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          notes="Docker images:"
          for target in app pipeline; do
            image="${registry}/${IMAGE_PREFIX}-${target}:${VERSION}"
            notes+=$'\n'"- ${target}: \`${image}\` (\`docker pull ${image}\`)"
          done
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            --notes "$notes"
